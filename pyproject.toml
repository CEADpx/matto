[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matto"
version = "0.2.0"
description = "Material and topology optimization of stimulus-responsive soft materials"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ian Galloway" },
    { name = "Prashant K. Jha" },
]

[tool.setuptools.packages.find]
where = ["src"]
