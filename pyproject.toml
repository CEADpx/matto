[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matto"
version = "0.3.0"
description = "Material and topology optimization of stimulus-responsive soft materials"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [
    { name = "Ian Galloway" },
    { name = "Prashant K. Jha" },
]

# FEniCSx (dolfinx, basix, ufl, petsc4py, mpi4py) is not listed: it is an
# MPI-linked conda dependency, installed from environment.yml.
dependencies = ["numpy", "scipy"]

[project.urls]
Homepage = "https://github.com/CEADpx/matto"
Documentation = "https://ceadpx.github.io/matto"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]
plot = ["matplotlib"]
docs = ["sphinx", "pydata-sphinx-theme"]

[tool.ruff.lint]
# pyflakes and the pycodestyle error classes; E741 is off because I is
# the identity tensor.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.pytest.ini_options]
# src/ on sys.path for the test run, so the suite works from a clean checkout
# with nothing installed. Without this the suite cannot import matto at all,
# and testing a change meant installing the package first.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not examples'"
markers = [
    "examples: one-iteration run of every example (use with mpirun)",
]
